<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silo Mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root, :root[data-theme="dark"] {
  --page: #0f0e0c; --bg: #171513; --bg2: #1b1916; --card: #201e1a; --card2: #262320; --card3: #2e2a26;
  --line: rgba(255,240,220,.08); --line2: rgba(255,240,220,.14); --hover: rgba(255,240,220,.05);
  --ink: #f2ede6; --muted: #a8a096; --faint: #6f685f;
  --accent: #e2774f; --accent-hover: #ec8a64; --accent-ink: #1a0f0a; --accent-soft: rgba(226,119,79,.14);
  --ok: #8cc49a; --warn: #e3b55b; --danger: #e86a5c;
  --shadow: 0 24px 60px -28px rgba(0,0,0,.7), 0 0 0 1px rgba(255,240,220,.07);
  --pop: 0 14px 36px -14px rgba(0,0,0,.6), 0 0 0 1px rgba(255,240,220,.1);
  --scrim: rgba(10,9,8,.6);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --page: #e7e2da; --bg: #f8f5f0; --bg2: #f2eee7; --card: #fffdf9; --card2: #f5f1ea; --card3: #ece6dc;
  --line: rgba(60,45,30,.1); --line2: rgba(60,45,30,.17); --hover: rgba(60,45,30,.05);
  --ink: #221d18; --muted: #6b6258; --faint: #9a9187;
  --accent: #c4552d; --accent-hover: #ad4824; --accent-ink: #ffffff; --accent-soft: rgba(196,85,45,.1);
  --ok: #3f8a52; --warn: #a8741a; --danger: #c0392b;
  --shadow: 0 24px 50px -30px rgba(60,40,20,.35), 0 0 0 1px rgba(60,45,30,.1);
  --pop: 0 14px 34px -14px rgba(60,40,20,.3), 0 0 0 1px rgba(60,45,30,.12);
  --scrim: rgba(40,30,20,.3);
  color-scheme: light;
}
:root {
  --sans: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--page); color: var(--ink); }
body { font: 500 13.5px/1.45 var(--sans); padding: 24px 16px 40px; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
p, h1, h2, h3, h4 { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mono); font-size: 12px; font-weight: 400; }
kbd { font: 500 11px/1 var(--mono); padding: 3px 5px; border-radius: 4px; color: var(--muted); background: var(--card3); border: 1px solid var(--line2); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: var(--accent-soft); }

/* ---------- Barra del mockup ---------- */
.demo { max-width: 1240px; margin: 0 auto 14px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; color: var(--muted); font-size: 12px; }
.demo h1 { font-size: 14px; font-weight: 700; color: var(--ink); margin-right: auto; }
.demo h1 span { color: var(--faint); font-weight: 500; }
.dgroup { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 3px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); flex: none; }
.seg button { border: 0; background: none; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--card3); color: var(--ink); }
.jump { max-width: 1240px; margin: 0 auto 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; color: var(--faint); font-size: 12px; }
.jump button { border: 0; background: none; padding: 0; color: var(--accent); font-size: 12px; font-weight: 600; }
.jump button:hover { text-decoration: underline; }
.jump .keys { margin-left: auto; display: flex; flex-wrap: wrap; gap: 4px 12px; }

/* ---------- Ventana ---------- */
.win { max-width: 1240px; height: 780px; margin: 0 auto; border-radius: 12px; overflow: hidden; position: relative; background: var(--bg); box-shadow: var(--shadow); display: flex; flex-direction: column; }
.win > * { flex: none; min-width: 0; }
.win.os-win { border-radius: 8px; }
.top { height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 14px 0 18px; border-bottom: 1px solid var(--line); background: var(--bg2); }
.os-win .top { padding-right: 0; }
.lights { display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; }
.lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
.os-win .lights { display: none; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; letter-spacing: -.02em; width: 190px; padding-left: 10px; }
.os-win .brand { padding-left: 0; }
.search { flex: 1; max-width: 560px; min-width: 0; height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 12px; background: var(--card); border: 1px solid var(--line2); border-radius: 8px; color: var(--faint); }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--ink); font-size: 13.5px; font-weight: 500; }
.search input::placeholder { color: var(--faint); }
.search input::-webkit-search-cancel-button { display: none; }
.spacer { flex: 1; }
.stats { font-family: var(--mono); font-size: 12px; color: var(--faint); white-space: nowrap; }
.stats b { color: var(--ink); font-weight: 500; }
.chrome-pill { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line2); background: var(--card); color: var(--muted); font: 500 12px var(--mono); white-space: nowrap; }
.chrome-pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.chrome-pill.bad { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
.chrome-pill.bad i { background: var(--danger); }
.winctl { display: none; align-self: stretch; }
.os-win .winctl { display: flex; }
.winctl span { width: 46px; display: grid; place-items: center; color: var(--muted); }
.winctl span:last-child:hover { background: #c42b1c; color: #fff; }

.ib { width: 34px; height: 34px; border-radius: 8px; border: 0; background: none; color: var(--muted); display: inline-grid; place-items: center; flex: none; }
.ib:hover { background: var(--hover); color: var(--ink); }
.btn { height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line2); background: var(--card2); color: var(--ink); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--card3); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.grad { border-color: transparent; background: var(--accent); color: var(--accent-ink); }
.btn.grad:hover:not(:disabled) { background: var(--accent-hover); }
.btn.grad kbd { background: rgba(0,0,0,.14); border-color: rgba(0,0,0,.12); color: var(--accent-ink); }
.btn.danger { border-color: transparent; background: #c0392b; color: #fff; }
.btn.danger:hover { background: #a93226; }
.btn.sm { height: 28px; padding: 0 11px; font-size: 12.5px; border-radius: 7px; }

/* ---------- Cuerpo ---------- */
.body { flex: 1; min-height: 0; display: flex; }
.side { width: 230px; flex: none; border-right: 1px solid var(--line); background: var(--bg2); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; overflow: auto; }
.side h4 { margin: 18px 10px 6px; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--faint); display: flex; justify-content: space-between; align-items: center; }
.side h4 button { border: 0; background: none; color: var(--faint); font-size: 16px; line-height: 1; padding: 0 2px; }
.side h4 button:hover { color: var(--ink); }
.nav { position: relative; display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 7px; border: 0; background: none; color: var(--muted); width: 100%; text-align: left; font-weight: 600; }
.nav:hover { background: var(--hover); color: var(--ink); }
.nav[aria-current="true"] { background: var(--accent-soft); color: var(--ink); }
.nav[aria-current="true"] > svg { color: var(--accent); }
.nav .c { margin-left: auto; font: 12px var(--mono); color: var(--faint); }
.nav .gd { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; margin: 0 2px; }
.nav.drop { box-shadow: inset 0 0 0 1.5px var(--accent); }
.side .input { height: 32px; margin: 2px 0; }
.side .hint { padding: 2px 10px; color: var(--faint); font-size: 12px; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; }
.ver { padding: 8px 10px 0; font: 11px var(--mono); color: var(--faint); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.mhead { padding: 22px 26px 0; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.mhead h2 { font-size: 26px; font-weight: 800; letter-spacing: -.035em; }
.mhead .meta { font: 12.5px var(--mono); color: var(--faint); }
.mhead .meta b { color: var(--muted); font-weight: 500; }
.chips { margin: 14px 26px 0; display: flex; gap: 22px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--line); }
.chip { height: 38px; padding: 0; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.chip b { font: 500 11.5px var(--mono); color: var(--faint); padding: 1px 6px; border-radius: 4px; background: var(--card2); }
.chip[aria-pressed="true"] b { color: var(--ink); background: var(--card3); }
.chips select { height: 28px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--muted); padding: 0 8px; font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
.content { flex: 1; min-height: 0; overflow: auto; padding: 18px 26px 90px; }

.banner { margin: 14px 26px 0; padding: 14px 16px; border-radius: 10px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; background: color-mix(in srgb, var(--warn) 9%, var(--card)); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
.banner svg { color: var(--warn); flex: none; }
.banner p { flex: 1; min-width: 260px; color: var(--muted); }
.banner strong { display: block; color: var(--ink); font-weight: 700; }

/* ---------- Avatar (circular) ---------- */
.av { --c: #888; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; line-height: 1; flex: none; position: relative; background: color-mix(in srgb, var(--c) 20%, var(--card2)); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 50%, transparent); }
.av.sm { width: 38px; height: 38px; font-size: 18px; }
.av.xs { width: 22px; height: 22px; font-size: 12px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 50%, transparent); }
.av.xl { width: 64px; height: 64px; font-size: 30px; }
.av .ck { position: absolute; right: -3px; top: -3px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 0 0 2px var(--card); }

/* ---------- Tarjetas ---------- */
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(284px, 1fr)); }
.card { --c: #888; position: relative; border-radius: 10px; padding: 16px 16px 16px 20px; display: flex; flex-direction: column; gap: 14px; user-select: none; background: var(--card); border: 1px solid var(--line); overflow: hidden; transition: border-color .15s; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
.card:hover { border-color: var(--line2); }
.card.run { border-color: color-mix(in srgb, var(--ok) 50%, transparent); }
.card[aria-current="true"], .card.multi { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.c-head { display: flex; gap: 12px; align-items: center; }
.c-title { flex: 1; min-width: 0; }
.c-title .nm { font-size: 16px; font-weight: 700; letter-spacing: -.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grp { display: inline-flex; align-items: center; gap: 6px; margin-top: 2px; font: 12px var(--mono); color: var(--faint); }
.grp i { width: 7px; height: 7px; border-radius: 50%; background: var(--g); }
.pill { font: 500 11.5px var(--mono); height: 22px; padding: 0 8px; border-radius: 4px; display: inline-flex; align-items: center; gap: 6px; color: var(--faint); background: var(--card2); white-space: nowrap; align-self: flex-start; }
.pill.on { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
.pill.on i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.busy { color: var(--accent); }
.spin { width: 11px; height: 11px; border-radius: 50%; border: 2px solid color-mix(in srgb, currentColor 25%, transparent); border-top-color: currentColor; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.well { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; background: var(--bg2); border: 1px solid var(--line); min-width: 0; }
.well .g { width: 22px; height: 22px; border-radius: 50%; flex: none; display: grid; place-items: center; background: #fff; box-shadow: 0 0 0 1px var(--line2); }
.well .g.off { background: var(--card3); filter: grayscale(1); opacity: .6; }
.well .em { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.well .em.off { color: var(--warn); }
.well .tag { font: 11.5px var(--mono); color: var(--faint); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.well .tag i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.c-meta { display: flex; align-items: center; gap: 8px; font: 12px var(--mono); color: var(--faint); min-width: 0; }
.c-meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-meta svg { flex: none; }
.c-meta .dotsep { opacity: .5; }
.c-notes { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: -6px; }
.c-foot { display: flex; gap: 8px; margin-top: auto; }
.launch { flex: 1; height: 38px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; background: var(--card2); color: var(--ink); border: 1px solid var(--line2); }
.launch svg { color: var(--c); }
.launch:hover:not(:disabled) { background: color-mix(in srgb, var(--c) 16%, var(--card2)); border-color: color-mix(in srgb, var(--c) 45%, transparent); }
.card[aria-current="true"] .launch:not(.run), .lrow[aria-current="true"] .launch:not(.run) { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.card[aria-current="true"] .launch:not(.run) svg, .lrow[aria-current="true"] .launch:not(.run) svg { color: currentColor; }
.launch.run svg { color: var(--ok); }
.launch:disabled { opacity: .4; cursor: not-allowed; }
.sq { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line2); background: var(--card2); color: var(--muted); display: grid; place-items: center; flex: none; }
.sq:hover { color: var(--ink); background: var(--card3); }
.sq.stop:hover { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.sq[aria-expanded="true"] { color: var(--ink); border-color: var(--accent); }

.addcard { border-radius: 10px; border: 1.5px dashed var(--line2); background: none; color: var(--faint); min-height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-weight: 600; }
.addcard:hover { color: var(--ink); border-color: var(--accent); background: var(--accent-soft); }
.addcard .plus { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--card2); border: 1px solid var(--line2); font-size: 22px; }

/* ---------- Lista ---------- */
.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
.lrow { --c: #888; position: relative; display: grid; grid-template-columns: 38px minmax(150px, 1.1fr) minmax(170px, 1.3fr) 104px 116px 214px; gap: 16px; align-items: center; padding: 10px 14px 10px 18px; border-bottom: 1px solid var(--line); user-select: none; }
.lrow:last-child { border-bottom: 0; }
.lrow::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c); }
.lrow:hover { background: var(--hover); }
.lrow[aria-current="true"], .lrow.multi { background: var(--accent-soft); }
.lrow .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .well { padding: 6px 10px; }
.lrow .when { font: 12px var(--mono); color: var(--faint); }
.lrow > .pill { justify-self: start; align-self: center; }
.lrow .acts { display: flex; gap: 6px; justify-content: flex-end; }
.lrow .launch { height: 32px; flex: none; padding: 0 14px; min-width: 128px; }
.lrow .sq { width: 32px; height: 32px; }

.nomatch { padding: 70px 20px; text-align: center; color: var(--muted); }
.nomatch strong { display: block; font-size: 16px; color: var(--ink); margin-bottom: 6px; }

/* ---------- Primer uso ---------- */
.hero { min-height: 100%; display: grid; place-items: center; padding: 20px 0 40px; text-align: center; }
.hero-in { max-width: 760px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.hero-mark { width: 96px; height: 96px; display: grid; place-items: center; border-radius: 50%; background: var(--accent-soft); }
.hero h2 { font-size: 38px; font-weight: 800; letter-spacing: -.045em; line-height: 1.05; }
.hero h2 span { color: var(--accent); }
.hero p.lead { color: var(--muted); font-size: 15px; max-width: 520px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; margin: 8px 0 6px; text-align: left; }
.step { padding: 16px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.step .n { font: 500 11px var(--mono); color: var(--accent); letter-spacing: .06em; }
.step strong { font-size: 14px; font-weight: 700; }
.step span { color: var(--muted); font-size: 12.5px; }
.hero .btn.grad { height: 42px; padding: 0 20px; font-size: 14px; }
.hero .fine { font: 12px var(--mono); color: var(--faint); }

/* ---------- Actividad ---------- */
.activity { border-top: 1px solid var(--line); background: var(--bg2); }
.act-bar { height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 18px; width: 100%; border: 0; background: none; color: var(--muted); text-align: left; }
.act-bar:hover { color: var(--ink); }
.act-bar strong { color: var(--ink); font-weight: 700; font-size: 13px; }
.act-bar .pillc { font: 11.5px var(--mono); padding: 2px 7px; border-radius: 4px; background: var(--card2); color: var(--muted); }
.act-bar .last { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px var(--mono); color: var(--faint); }
.act-bar .chev { transition: transform .15s; }
.activity.open .chev { transform: rotate(180deg); }
.act-list { max-height: 0; overflow: auto; transition: max-height .2s ease; }
.activity.open .act-list { max-height: 190px; }
.act-item { display: grid; grid-template-columns: 70px 22px 1fr; gap: 10px; align-items: center; padding: 7px 18px; font-size: 12.5px; }
.act-item time { font: 12px var(--mono); color: var(--faint); }
.act-item span { color: var(--muted); }
.act-item b { color: var(--ink); font-weight: 700; }

/* ---------- Selección múltiple ---------- */
.batch { position: absolute; left: 50%; bottom: 56px; transform: translateX(-50%); z-index: 15; display: flex; align-items: center; gap: 8px; white-space: nowrap; padding: 7px 7px 7px 16px; border-radius: 10px; background: var(--card3); box-shadow: var(--pop); }
.batch strong { margin-right: 6px; font-weight: 700; }

/* ---------- Menú ---------- */
.menu { position: absolute; z-index: 30; min-width: 232px; padding: 6px; border-radius: 10px; background: var(--card2); box-shadow: var(--pop); }
.menu button { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: none; text-align: left; padding: 7px 9px; border-radius: 6px; color: var(--ink); font-size: 13px; font-weight: 600; }
.menu button svg { color: var(--muted); }
.menu button:hover:not(:disabled), .menu button:focus-visible { background: var(--accent); color: var(--accent-ink); outline: none; }
.menu button:hover:not(:disabled) svg, .menu button:focus-visible svg, .menu button:hover:not(:disabled) .k { color: inherit; }
.menu button:disabled { color: var(--faint); cursor: not-allowed; }
.menu button .k { margin-left: auto; font: 11.5px var(--mono); color: var(--faint); }

    grid: '<svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="4" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="13" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="13" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>',

    lib: '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="5" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="10" y="3" width="5" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="17" y="9" width="4" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>',

    win: '<svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="14" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 21h12a2 2 0 0 0 2-2V9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',

    edit: '<svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L18.5 9.5l-4-4L4 16v4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',

    trash: '<svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    close: '<svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    check: '<svg width="10" height="10" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    link: '<svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    warn: '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20L12 3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v4m0 3v.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    g: '<svg width="13" height="13" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>',
  };

  /* ---------- Filtros ---------- */
  const inGroup = (p) => (S.group ? p.group === S.group : true);
  const inStatus = (p) => S.status === "open" ? p.open : S.status === "closed" ? !p.open : S.status === "nosession" ? !p.account : true;
  function visible() {
    const q = S.q.trim().toLowerCase();
    let list = S.profiles.filter((p) => inGroup(p) && inStatus(p));
    if (q) list = list.filter((p) => [p.name, p.notes, p.account || "", grp(p.group)?.name || "", host(p)].join(" ").toLowerCase().includes(q));
    list.sort((a, b) => (S.sort === "name" ? a.name.localeCompare(b.name, "es") : (b.open - a.open) || ((b.last ?? -1) - (a.last ?? -1))));
    return list;
  }

  /* ---------- Piezas ---------- */
  const avatar = (p, cls = "") => `<div class="av ${cls}" style="--c:${hex(p.color)}">${p.emoji}${S.multi.has(p.id) ? `<span class="ck">${I.check}</span>` : ""}</div>`;
  function pill(p) {
    if (S.opening.has(p.id)) return '<span class="pill busy"><span class="spin"></span>abriendo</span>';
    return p.open ? '<span class="pill on"><i></i>abierto</span>' : '<span class="pill">cerrado</span>';
  }
  function well(p) {
    return p.account
      ? `<div class="well" title="Sesión de Google en este perfil"><span class="g">${I.g}</span><span class="em">${esc(p.account)}</span><span class="tag"><i></i>sesión</span></div>`
      : `<div class="well" title="Inicia sesión en Google la próxima vez que lo abras"><span class="g off">${I.g}</span><span class="em off">Sin sesión de Google</span><span class="tag">pendiente</span></div>`;
  }
  const grpLabel = (p) => { const g = grp(p.group); return g ? `<span class="grp" style="--g:${hex(g.color)}"><i></i>${esc(g.name)}</span>` : '<span class="grp">sin grupo</span>'; };
  function launchBtns(p, compact) {
    const can = !!currentBrowser(), busy = S.opening.has(p.id);
    const dis = !can || busy ? "disabled" : "";
    const why = !can ? ' title="No hay navegador configurado"' : "";
    if (p.open) return `
      <button type="button" class="launch run" data-act="abrir" ${dis}${why || ' title="Abre otra ventana de este perfil"'}>${I.win}${compact ? "Ventana" : "Nueva ventana"}</button>
      <button type="button" class="sq stop" data-act="cerrar" aria-label="Cerrar Chrome de ${esc(p.name)}" title="Cerrar Chrome">${I.stop}</button>
      <button type="button" class="sq" data-act="menu" aria-label="Más acciones" aria-haspopup="menu" aria-expanded="false">${I.more}</button>`;
    return `
      <button type="button" class="launch" data-act="abrir" ${dis}${why || ` title="Abrir en ${esc(host(p))}"`}>${busy ? '<span class="spin"></span>Abriendo' : I.play + "Abrir"}</button>
      <button type="button" class="sq" data-act="menu" aria-label="Más acciones" aria-haspopup="menu" aria-expanded="false">${I.more}</button>`;
  }
  function card(p, preview) {
    const cur = !preview && S.sel === p.id && !S.multi.size;
    return `<article class="card ${p.open ? "run" : ""} ${S.multi.has(p.id) ? "multi" : ""}" ${preview ? "" : `data-id="${p.id}"`} style="--c:${hex(p.color)}" aria-current="${cur}">
      <div class="c-head">${avatar(p)}<div class="c-title"><div class="nm">${esc(p.name || "Nombre del perfil")}</div>${grpLabel(p)}</div>${pill(p)}</div>
      ${well(p)}
      <div class="c-meta">${I.link}<span>${esc(host(p))}</span><span class="dotsep">·</span><span>${p.open ? since(p.openedAt) : fmt(p.last)}</span></div>
      ${p.notes ? `<div class="c-notes" title="${esc(p.notes)}">${esc(p.notes)}</div>` : ""}
      <div class="c-foot">${launchBtns(p)}</div>
    </article>`;
  }
  function row(p) {
    return `<div class="lrow ${p.open ? "run" : ""} ${S.multi.has(p.id) ? "multi" : ""}" data-id="${p.id}" style="--c:${hex(p.color)}" aria-current="${S.sel === p.id && !S.multi.size}" title="${esc(p.notes)}">
      ${avatar(p, "sm")}
      <div style="min-width:0"><div class="nm">${esc(p.name)}</div>${grpLabel(p)}</div>
      ${well(p)}
      ${pill(p)}
      <span class="when">${p.open ? since(p.openedAt) : fmt(p.last)}</span>
      <div class="acts">${launchBtns(p, true)}</div>
    </div>`;
  }

  /* ---------- Render ---------- */
  function renderSide() {
    const n = (f) => S.profiles.filter(f).length;
    const nav = (gid, icon, label, count) => `<button type="button" class="nav" data-group="${gid || ""}" aria-current="${S.group === gid}">${icon}<span>${esc(label)}</span><span class="c">${count}</span></button>`;
    side.innerHTML = `
      ${nav(null, I.lib, "Todos los perfiles", S.profiles.length)}
      <h4>Grupos <button type="button" data-act="addgroup" aria-label="Nuevo grupo" title="Nuevo grupo">+</button></h4>
      ${S.groups.map((g) => nav(g.id, `<span class="gd" style="--c:${hex(g.color)}"></span>`, g.name, n((p) => p.group === g.id))).join("")}
      ${S.addingGroup ? '<input class="input" id="newgroup" placeholder="Nombre del grupo" maxlength="24" aria-label="Nombre del grupo">' : ""}
      ${S.groups.length || S.addingGroup ? "" : '<p class="hint">Agrupa perfiles por cliente o equipo.</p>'}
      <div class="side-foot">
        <button type="button" class="nav" data-act="ajustes">${I.gear}<span>Ajustes</span><span class="c">,</span></button>
        <p class="ver">silo 0.1.0 · ${S.os === "mac" ? "macOS" : "Windows"}</p>
      </div>`;
    const ng = $("#newgroup");
    if (!ng) return;
    ng.focus();
    ng.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { S.addingGroup = false; render(); }
      if (e.key !== "Enter") return;
      const name = ng.value.trim();
      if (name && !S.groups.some((g) => g.name.toLowerCase() === name.toLowerCase())) {
        const g = { id: "g" + S.seq++, name, color: COLORS[(S.groups.length + 3) % COLORS.length].id };
        S.groups.push(g); S.group = g.id; toast(`Grupo «${name}» creado. Arrastra perfiles hasta él.`);
      }
      S.addingGroup = false; render();
    });
    ng.addEventListener("blur", () => { if (S.addingGroup) { S.addingGroup = false; setTimeout(render); } });
  }
  function renderHead() {
    if (!S.profiles.length) { head.innerHTML = ""; return; }
    const base = S.profiles.filter(inGroup);
    const c = (f) => base.filter(f).length;
    const g = grp(S.group);
    const chip = (key, label, count, color) => `<button type="button" class="chip" data-status="${key}" aria-pressed="${S.status === key}">${color ? `<i style="--c:${color}"></i>` : ""}${label}<b>${count}</b></button>`;
    head.innerHTML = `
      <div class="mhead">
        <h2>${g ? esc(g.name) : "Todos los perfiles"}</h2>
        <span class="meta"><b>${base.length}</b> total · <b>${c((p) => p.open)}</b> ${c((p) => p.open) === 1 ? "abierto" : "abiertos"}</span>
        <div class="spacer"></div>
        <div class="seg" role="group" aria-label="Vista">
          <button type="button" data-view="grid" aria-pressed="${S.view === "grid"}" aria-label="Tarjetas" title="Tarjetas">${I.grid}</button>
          <button type="button" data-view="list" aria-pressed="${S.view === "list"}" aria-label="Lista" title="Lista">${I.list}</button>
        </div>
        <button type="button" class="btn grad" data-act="crear">+ Nuevo perfil <kbd>N</kbd></button>
      </div>
      <div class="chips">
        ${chip("all", "Todos", base.length)}
        ${chip("open", "Abiertos", c((p) => p.open), "var(--ok)")}
        ${chip("closed", "Cerrados", c((p) => !p.open), "var(--faint)")}
        ${chip("nosession", "Sin sesión", c((p) => !p.account), "var(--warn)")}
        <span class="spacer"></span>
        <select id="sort" aria-label="Ordenar"><option value="recent" ${S.sort === "recent" ? "selected" : ""}>Recientes primero</option><option value="name" ${S.sort === "name" ? "selected" : ""}>Nombre A–Z</option></select>
      </div>`;
  }
  function renderHero() {
    return `<div class="hero"><div class="hero-in">
      <div class="hero-mark"><svg width="52" height="52" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2" y="9" width="5.5" height="13" rx="2.75" fill="var(--accent)" opacity=".55"/><rect x="9.25" y="2" width="5.5" height="20" rx="2.75" fill="var(--accent)"/><rect x="16.5" y="6" width="5.5" height="16" rx="2.75" fill="var(--accent)" opacity=".8"/></svg></div>
      <h2>Una cuenta, <span>un Chrome aparte.</span></h2>
      <p class="lead">Cada perfil guarda su propia sesión de Google, cookies, historial y extensiones. Ábrelos a la vez sin que se mezclen.</p>
      <div class="steps">
        <div class="step"><span class="n">01</span><strong>Crea un perfil</strong><span>Nombre, color, ícono y la página con la que abre.</span></div>
        <div class="step"><span class="n">02</span><strong>Ábrelo en Chrome</strong><span>Silo lanza tu Chrome con la carpeta de ese perfil.</span></div>
        <div class="step"><span class="n">03</span><strong>Inicia sesión una vez</strong><span>La cuenta queda guardada y aparece en la tarjeta.</span></div>
      </div>
      <button type="button" class="btn grad" data-act="crear">+ Crear primer perfil <kbd>N</kbd></button>
      <span class="fine">${esc(DATA_DIR[S.os])}</span>
    </div></div>`;
  }
  function renderActivity() {
    const today = S.log.filter((e) => dayDiff(e.t) === 0).length;
    $("#act-count").textContent = `${today} hoy`;
    const last = S.log[0];
    $("#act-last").innerHTML = last ? `${clock(last.t)} · ${last.text.replace(/<\/?b>/g, "")}` : "Sin actividad todavía";
    $("#activity").classList.toggle("open", S.actOpen);
    win.classList.toggle("act-open", S.actOpen);
    $("#act-bar").setAttribute("aria-expanded", String(S.actOpen));
    $("#act-list").innerHTML = S.log.map((e) => {
      const p = byId(e.pid) || e;
      return `<div class="act-item"><time>${clock(e.t)}</time>${p.emoji ? `<div class="av xs" style="--c:${hex(p.color)}">${p.emoji}</div>` : "<span></span>"}<span>${e.text}</span></div>`;
    }).join("") || '<div class="act-item"><time></time><span></span><span>Aquí aparecen aperturas, cierres y sesiones detectadas.</span></div>';
  }
  function renderBatch() {
    const n = S.multi.size;
    win.classList.toggle("has-batch", n > 1);
    if (n < 2) { batch.hidden = true; return; }
    const closed = [...S.multi].map(byId).filter((p) => p && !p.open).length;
    batch.hidden = false;
    batch.innerHTML = `<strong>${n} seleccionados</strong>
      <button type="button" class="btn sm grad" data-b="abrir" ${closed && currentBrowser() ? "" : "disabled"}>${I.play} Abrir ${closed || ""}</button>
      <button type="button" class="btn sm" data-b="mover">Mover a grupo</button>
      <button type="button" class="ib" data-b="clear" aria-label="Quitar selección" title="Quitar selección (Esc)">${I.close}</button>`;
  }
  function render() {
    win.className = "win os-" + S.os + (S.multi.size > 1 ? " has-batch" : "") + (S.actOpen ? " act-open" : "");
    const has = S.profiles.length > 0;
    $(".search").style.visibility = has ? "" : "hidden";
    $("#k-search").textContent = S.os === "mac" ? "⌘ K" : "Ctrl K";
    const nOpen = S.profiles.filter((p) => p.open).length;
    $("#stats").innerHTML = has ? `<b>${nOpen}</b> ${nOpen === 1 ? "abierto" : "abiertos"} · <b>${S.profiles.length}</b> perfiles` : "";
    const br = currentBrowser(), pillEl = $("#chrome-pill");
    pillEl.className = "chrome-pill" + (br ? "" : " bad");
    pillEl.querySelector("span").textContent = br ? `${br.name.replace("Google ", "")} ${br.ver.split(".")[0]}` : "sin navegador";
    pillEl.title = br ? br.path : "Elegir navegador";
    renderSide(); renderHead();

    let html = "";
    if (!br) html += `<div class="banner" role="alert">${I.warn}<p><strong>No encontramos Chrome ni otro navegador Chromium.</strong>Puedes crear y editar perfiles; para abrirlos, elige un navegador.</p>
      <button type="button" class="btn sm" data-act="descargar">Descargar Chrome</button><button type="button" class="btn sm grad" data-act="elegir">Elegir ejecutable…</button></div>`;
    if (!has) html += renderHero();
    else {
      const list = visible();
      if (S.sel && !list.some((p) => p.id === S.sel)) S.sel = null;
      if (!list.length) {
        const g = grp(S.group);
        html += S.q ? `<div class="nomatch"><strong>Nada coincide con «${esc(S.q)}»</strong>Se busca en nombre, cuenta de Google, grupo, página de inicio y notas.<br><br><button type="button" class="btn sm" data-act="limpiar">Limpiar búsqueda</button></div>`
          : S.status === "open" ? `<div class="nomatch"><strong>Ningún perfil abierto</strong>Cuando abras uno, aparece aquí con su tiempo en uso.</div>`
          : S.status === "nosession" ? `<div class="nomatch"><strong>Todos tienen sesión de Google</strong>Aquí aparecen los perfiles donde aún no se inició sesión.</div>`
          : `<div class="nomatch"><strong>${g ? `«${esc(g.name)}» está vacío` : "Sin resultados"}</strong>Arrastra perfiles hasta el grupo o usa «Mover a» en su menú.</div>`;
      } else if (S.view === "grid") {
        html += `<div class="grid">${list.map((p) => card(p)).join("")}${S.status === "all" && !S.q ? `<button type="button" class="addcard" data-act="crear"><span class="plus">+</span>Nuevo perfil${S.group ? " en " + esc(grp(S.group).name) : ""}</button>` : ""}</div>`;
      } else html += `<div class="list">${list.map(row).join("")}</div>`;
    }
    content.innerHTML = html;
    renderActivity(); renderBatch();
  }

  /* ---------- Acciones ---------- */
  let toastT;
  function toast(text, p) {
    toastEl.innerHTML = (p ? `<div class="av xs" style="--c:${hex(p.color)}">${p.emoji}</div>` : `<span class="ok">${I.check}</span>`) + `<span>${esc(text)}</span>`;
    toastEl.classList.add("show"); clearTimeout(toastT);
    toastT = setTimeout(() => toastEl.classList.remove("show"), 3200);
  }
  function openProfile(p, quiet) {
    if (!p || S.opening.has(p.id)) return;
    if (!currentBrowser()) { toast("Elige un navegador antes de abrir perfiles."); return; }
    if (p.open) { log(p, `<b>${esc(p.name)}</b>: nueva ventana`); if (!quiet) toast(`Nueva ventana de ${p.name}`, p); render(); return; }
    S.opening.add(p.id); render();
    setTimeout(() => {
      S.opening.delete(p.id); p.open = true; p.openedAt = NOW; p.last = NOW;
      log(p, `<b>${esc(p.name)}</b> abierto en ${esc(host(p))}`); render();
      if (!quiet) toast(`${p.name} abierto en ${host(p)}`, p);
    }, 900);
  }
  function closeChrome(p) { p.open = false; log(p, `<b>${esc(p.name)}</b>: Chrome cerrado`); render(); toast(`Chrome de ${p.name} cerrado`, p); }
  function duplicate(p) {
    let base = p.name + " (copia)", name = base, i = 2;
    while (S.profiles.some((x) => x.name.toLowerCase() === name.toLowerCase())) name = `${base} ${i++}`;
    const n = { ...p, id: "p" + S.seq++, name, account: null, open: false, last: null };
    S.profiles.splice(S.profiles.indexOf(p) + 1, 0, n); S.sel = n.id; render();
    toast("Duplicado sin sesión: se copió la configuración, no las cookies", n);
  }
  function moveTo(ids, gid) {
    ids.forEach((id) => { const p = byId(id); if (p) p.group = gid; });
    const g = grp(gid); S.multi.clear(); render();
    toast(`${ids.length > 1 ? ids.length + " perfiles movidos" : "Movido"} a ${g ? g.name : "sin grupo"}`);
  }
  function chooseExecutable() { S.custom = CUSTOM[S.os]; S.browser = "custom"; render(); toast("Navegador: " + S.custom.split(sep()).pop()); }

  /* ---------- Menú ---------- */
  function moveItems(current) {
    return S.groups.map((g) => `<button type="button" role="menuitem" data-move="${g.id}" ${current === g.id ? "disabled" : ""}><span class="gd" style="--c:${hex(g.color)}"></span>${esc(g.name)}${current === g.id ? '<span class="k">actual</span>' : ""}</button>`).join("")
      + `<button type="button" role="menuitem" data-move="" ${current ? "" : "disabled"}><span class="gd" style="--c:transparent;box-shadow:inset 0 0 0 1.5px var(--faint)"></span>Sin grupo</button>`;
  }
  function placeMenu(x, y, anchor) {
    menu.hidden = false;
    const wr = win.getBoundingClientRect(), mw = menu.offsetWidth, mh = menu.offsetHeight;
    let left = x - wr.left, top = y - wr.top;
    if (anchor) { const r = anchor.getBoundingClientRect(); left = r.right - wr.left - mw; top = r.bottom - wr.top + 6; if (top + mh > wr.height - 8) top = r.top - wr.top - mh - 6; }
    menu.style.left = Math.max(8, Math.min(left, wr.width - mw - 8)) + "px";
    menu.style.top = Math.max(8, Math.min(top, wr.height - mh - 8)) + "px";
    menu.querySelector("button:not(:disabled)")?.focus();
  }
  function openMenu(p, x, y, useAnchor) {
    S.sel = p.id; S.multi.clear(); render();
    const anchor = useAnchor ? content.querySelector(`[data-id="${p.id}"] [data-act="menu"]`) : null;
    anchor?.setAttribute("aria-expanded", "true");
    const canDel = !p.open && !S.opening.has(p.id);
    menu.innerHTML = `
      <button type="button" role="menuitem" data-m="abrir" ${currentBrowser() ? "" : "disabled"}>${p.open ? I.win + "Nueva ventana" : I.play + "Abrir"}<span class="k">↵</span></button>
      ${p.open ? `<button type="button" role="menuitem" data-m="cerrar">${I.stop}Cerrar Chrome</button>` : ""}
      <button type="button" role="menuitem" data-m="editar">${I.edit}Editar…<span class="k">E</span></button>
      <button type="button" role="menuitem" data-m="duplicar">${I.dup}Duplicar sin sesión</button>
      <button type="button" role="menuitem" data-m="carpeta">${I.folder}Mostrar carpeta en ${fileMgr()}</button>
      <hr><p class="lbl">Mover a</p>${moveItems(p.group)}<hr>
      <button type="button" role="menuitem" class="del" data-m="eliminar" ${canDel ? "" : "disabled"}>${I.trash}Eliminar…<span class="k">⌫</span></button>
      ${canDel ? "" : '<p class="why">Cierra Chrome de este perfil para eliminarlo.</p>'}`;
    menu.dataset.ids = p.id;
    placeMenu(x, y, anchor);
  }
  function closeMenu() { menu.hidden = true; $$('[aria-expanded="true"]', content).forEach((b) => b.setAttribute("aria-expanded", "false")); }

  /* ---------- Diálogos ---------- */
  let lastFocus = null;
  function showDialog(html, focusSel) {
    closeMenu(); lastFocus = document.activeElement;
    layer.innerHTML = html; layer.hidden = false;
    (layer.querySelector(focusSel || "input, button") || layer).focus();
  }
  function closeDialog() { layer.hidden = true; layer.innerHTML = ""; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }

  function dlgProfile(p) {
    const editing = !!p;
    const d = p || { id: "<id>", name: "", color: COLORS[S.profiles.length % COLORS.length].id, emoji: "💼", notes: "", group: S.group, start: "newtab", url: "", account: null, open: false, last: null };
    const folder = DATA_DIR[S.os] + sep() + d.id;
    showDialog(`
      <form class="dialog xl" id="f" role="dialog" aria-modal="true" aria-labelledby="t-f" novalidate style="--c:${hex(d.color)}">
        <aside class="d-pv">
          <span class="lbl">Vista previa</span>
          <div id="pv"></div>
          <p class="note">${editing ? "Carpeta del perfil" : "Se creará en"}<br><span class="mono">${esc(folder)}</span></p>
        </aside>
        <div class="d-main">
          <div class="d-head"><h2 id="t-f">${editing ? "Editar perfil" : "Nuevo perfil"}</h2><button type="button" class="ib" data-close aria-label="Cerrar">${I.close}</button></div>
          <div class="d-body">
            <div class="two">
              <div class="field"><label for="f-name">Nombre</label>
                <input class="input" id="f-name" value="${esc(d.name)}" placeholder="Ej.: Cliente Oeste" maxlength="40" autocomplete="off" aria-describedby="f-err"><p class="err" id="f-err" hidden></p></div>
              <div class="field"><label for="f-group">Grupo <span class="opt">opcional</span></label>
                <select class="input" id="f-group"><option value="">Sin grupo</option>${S.groups.map((g) => `<option value="${g.id}" ${d.group === g.id ? "selected" : ""}>${esc(g.name)}</option>`).join("")}</select></div>
            </div>
            <div class="field"><span class="fl" id="l-c">Color</span>
              <div class="swatches" role="radiogroup" aria-labelledby="l-c">${COLORS.map((c) => `<label title="${c.name}"><input type="radio" name="color" value="${c.id}" ${c.id === d.color ? "checked" : ""} aria-label="${c.name}"><span style="--c:${c.hex}"></span></label>`).join("")}</div></div>
            <div class="field"><span class="fl" id="l-e">Ícono</span>
              <div class="emojis" role="radiogroup" aria-labelledby="l-e">${EMOJIS.map((e) => `<label><input type="radio" name="emoji" value="${e}" ${e === d.emoji ? "checked" : ""} aria-label="${e}"><span>${e}</span></label>`).join("")}</div></div>
            <div class="two">
              <div class="field"><label for="f-start">Abrir en</label>
                <select class="input" id="f-start">${START.map((s) => `<option value="${s.id}" ${d.start === s.id ? "selected" : ""}>${s.name}</option>`).join("")}</select></div>
              <div class="field" id="f-url-w" ${d.start === "custom" ? "" : "hidden"}><label for="f-url">URL</label>
                <input class="input" id="f-url" type="url" value="${esc(d.url)}" placeholder="https://" autocomplete="off"></div>
            </div>
            <div class="field"><label for="f-notes">Notas <span class="opt">opcional</span></label>
              <textarea class="input" id="f-notes" rows="2" placeholder="Para qué usas esta cuenta">${esc(d.notes)}</textarea></div>
          </div>
          <div class="d-foot">
            ${editing ? `<button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn grad">Guardar cambios</button>`
              : `<span class="left"><kbd>${S.os === "mac" ? "⌘" : "Ctrl"} ↵</kbd> crear y abrir</span><button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn">Crear</button><button type="button" class="btn grad" data-co ${currentBrowser() ? "" : 'disabled title="No hay navegador configurado"'}>${I.play} Crear y abrir</button>`}
          </div>
        </div>
      </form>`, "#f-name");
    const f = $("#f"), name = $("#f-name"), err = $("#f-err");
    const val = () => ({ name: name.value.trim(), color: f.querySelector('[name="color"]:checked').value, emoji: f.querySelector('[name="emoji"]:checked').value,
      group: $("#f-group").value || null, start: $("#f-start").value, url: $("#f-url").value.trim(), notes: $("#f-notes").value.trim() });
    const sync = () => {
      const v = val();
      f.style.setProperty("--c", hex(v.color));
      $("#f-url-w").hidden = v.start !== "custom";
      $("#pv").innerHTML = card({ ...d, ...v, name: v.name, id: "pv" }, true);
    };
    sync();
    f.addEventListener("input", (e) => { if (e.target === name) { err.hidden = true; name.removeAttribute("aria-invalid"); } sync(); });
    f.addEventListener("change", sync);
    const save = (andOpen) => {
      const v = val();
      const dupe = S.profiles.some((x) => x.id !== d.id && x.name.toLowerCase() === v.name.toLowerCase());
      if (!v.name || dupe) { err.textContent = !v.name ? "Escribe un nombre." : `Ya tienes un perfil llamado «${v.name}».`; err.hidden = false; name.setAttribute("aria-invalid", "true"); name.focus(); return; }
      if (v.start === "custom" && !/^https?:\/\/\S+\.\S+/.test(v.url)) { $("#f-url").setAttribute("aria-invalid", "true"); $("#f-url").focus(); return; }
      let t;
      if (editing) { Object.assign(p, v); t = p; toast("Cambios guardados", p); }
      else { t = { id: "p" + S.seq++, account: null, open: false, last: null, ...v }; S.profiles.unshift(t); log(t, `<b>${esc(t.name)}</b> creado`); if (!andOpen) toast(`${v.name} creado`, t); }
      S.sel = t.id; S.multi.clear(); S.q = ""; $("#q").value = "";
      if (!inGroup(t)) S.group = null;
      if (!inStatus(t)) S.status = "all";
      closeDialog(); render();
      if (andOpen) openProfile(t);
    };
    f.addEventListener("submit", (e) => { e.preventDefault(); save(false); });
    f.querySelector("[data-co]")?.addEventListener("click", () => save(true));
    f.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && !editing && currentBrowser()) { e.preventDefault(); save(true); } });
  }

  function dlgDelete(p) {
    if (p.open) { toast(`Cierra Chrome de ${p.name} para eliminarlo`, p); return; }
    showDialog(`
      <form class="dialog" id="fd" role="alertdialog" aria-modal="true" aria-labelledby="t-d" aria-describedby="d-d">
        <div class="d-head"><h2 id="t-d">¿Eliminar ${esc(p.name)}?</h2><button type="button" class="ib" data-close aria-label="Cerrar">${I.close}</button></div>
        <div class="d-body">
          <div style="display:flex;gap:12px;align-items:center">${avatar(p, "sm")}<p id="d-d" style="color:var(--muted)">Desaparece de Silo${p.account ? `. La sesión de <b style="color:var(--ink)">${esc(p.account)}</b> vive en su carpeta` : ""}. ¿Qué hacemos con la carpeta?</p></div>
          <div class="choice" role="radiogroup">
            <label><input type="radio" name="wipe" value="keep" checked><span><strong>Conservar la carpeta</strong><small>Cookies, sesión e historial siguen en el disco.</small></span></label>
            <label class="danger"><input type="radio" name="wipe" value="wipe"><span><strong>Borrar la carpeta</strong><small>Se borran cookies, sesión, historial y extensiones. No se puede deshacer.</small></span></label>
          </div>
        </div>
        <div class="d-foot"><button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn danger" id="d-go">Eliminar</button></div>
      </form>`, "[data-close].btn");
    const f = $("#fd");
    f.addEventListener("change", () => { $("#d-go").textContent = f.wipe.value === "wipe" ? "Eliminar y borrar datos" : "Eliminar"; });
    f.addEventListener("submit", (e) => {
      e.preventDefault();
      const wipe = f.wipe.value === "wipe", i = visible().indexOf(p);
      S.profiles.splice(S.profiles.indexOf(p), 1);
      const rest = visible(); S.sel = rest[Math.min(i, rest.length - 1)]?.id || null;
      log(null, `<b>${esc(p.name)}</b> eliminado${wipe ? " y su carpeta borrada" : ""}`);
      closeDialog(); render();
      toast(wipe ? `${p.name} eliminado y su carpeta borrada` : `${p.name} eliminado; la carpeta se conservó`);
    });
  }

  function dlgSettings() {
    const rows = browsers().map((b) => `<label class="${b.ver ? "" : "off"}"><input type="radio" name="br" value="${b.id}" ${S.browser === b.id && b.ver ? "checked" : ""} ${b.ver ? "" : "disabled"}>
      <span style="flex:1;min-width:0"><strong>${b.name} ${b.ver ? `<span class="badge">detectado · ${b.ver}</span>` : '<span class="badge no">no encontrado</span>'}</strong><span class="mono">${esc(b.path)}</span></span></label>`).join("");
    const custom = S.custom ? `<label><input type="radio" name="br" value="custom" ${S.browser === "custom" ? "checked" : ""}><span style="flex:1;min-width:0"><strong>Personalizado <span class="badge">130.0</span></strong><span class="mono">${esc(S.custom)}</span></span></label>` : "";
    showDialog(`
      <div class="dialog wide" role="dialog" aria-modal="true" aria-labelledby="t-s" tabindex="-1">
        <div class="d-head"><h2 id="t-s">Ajustes</h2><button type="button" class="ib" data-close aria-label="Cerrar">${I.close}</button></div>
        <div class="d-body">
          <section class="section"><h3>Navegador</h3><p>Silo abre cada perfil con este navegador. Sirve cualquiera basado en Chromium.</p>
            <div class="choice" id="br" role="radiogroup" aria-label="Navegador">${rows}${custom}</div>
            <div><button type="button" class="btn sm" data-s="elegir">Elegir otro ejecutable…</button></div></section>
          <section class="section"><h3>Datos de los perfiles</h3><p>Una carpeta por perfil. Cerrar Silo no cierra los Chrome que abriste.</p>
            <div class="pathrow"><span class="mono">${esc(DATA_DIR[S.os])}</span><button type="button" class="btn sm" data-s="carpeta">Mostrar en ${fileMgr()}</button></div></section>
          <section class="section"><h3>Actualizaciones</h3>
            <div class="pathrow"><span class="mono">silo 0.1.0 · firmada · al día</span><button type="button" class="btn sm" data-s="upd">Buscar ahora</button></div></section>
        </div>
        <div class="d-foot"><button type="button" class="btn grad" data-close>Listo</button></div>
      </div>`, ".dialog");
    $("#br").addEventListener("change", (e) => { S.browser = e.target.value; render(); toast("Navegador: " + (currentBrowser()?.name || "")); });
    layer.querySelector('[data-s="elegir"]').addEventListener("click", () => { chooseExecutable(); dlgSettings(); });
    layer.querySelector('[data-s="carpeta"]').addEventListener("click", () => toast(`Se abre la carpeta en ${fileMgr()}`));
    layer.querySelector('[data-s="upd"]').addEventListener("click", () => toast("Silo 0.1.0 es la última versión"));
  }

  /* ---------- Eventos ---------- */
  function selectClick(p, e) {
    const list = visible();
    if (e.shiftKey && S.sel) {
      const a = list.findIndex((x) => x.id === S.sel), b = list.findIndex((x) => x.id === p.id);
      S.multi = new Set(list.slice(Math.min(a, b), Math.max(a, b) + 1).map((x) => x.id));
    } else if (e.metaKey || e.ctrlKey) {
      if (!S.multi.size && S.sel) S.multi.add(S.sel);
      S.multi.has(p.id) ? S.multi.delete(p.id) : S.multi.add(p.id);
      S.sel = p.id;
      if (S.multi.size < 2) { S.sel = [...S.multi][0] || null; S.multi.clear(); }
    } else { S.multi.clear(); S.sel = p.id; }
    render();
  }
  head.addEventListener("click", (e) => {
    const s = e.target.closest("[data-status]"); if (s) { S.status = s.dataset.status; S.multi.clear(); render(); return; }
    const v = e.target.closest("[data-view]"); if (v) { S.view = v.dataset.view; render(); return; }
    if (e.target.closest('[data-act="crear"]')) dlgProfile(null);
  });
  head.addEventListener("change", (e) => { if (e.target.id === "sort") { S.sort = e.target.value; render(); } });
  content.addEventListener("click", (e) => {
    const item = e.target.closest("[data-id]"), btn = e.target.closest("[data-act]"), p = item && byId(item.dataset.id);
    if (btn) {
      const a = btn.dataset.act;
      if (a === "abrir") openProfile(p);
      else if (a === "cerrar") closeChrome(p);
      else if (a === "menu") { if (!menu.hidden && menu.dataset.ids === p.id) closeMenu(); else openMenu(p, 0, 0, true); }
      else if (a === "crear") dlgProfile(null);
      else if (a === "limpiar") { S.q = ""; $("#q").value = ""; render(); }
      else if (a === "descargar") toast("Se abre google.com/chrome en el navegador del sistema");
      else if (a === "elegir") chooseExecutable();
      return;
    }
    if (p) selectClick(p, e);
  });
  content.addEventListener("dblclick", (e) => { const it = e.target.closest("[data-id]"); if (it && !e.target.closest("button") && !e.metaKey && !e.ctrlKey && !e.shiftKey) openProfile(byId(it.dataset.id)); });
  content.addEventListener("contextmenu", (e) => { const it = e.target.closest("[data-id]"); if (!it) return; e.preventDefault(); openMenu(byId(it.dataset.id), e.clientX, e.clientY, false); });
  menu.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b || b.disabled) return;
    const ids = menu.dataset.ids.split(","), p = byId(ids[0]); closeMenu();
    if (b.dataset.move !== undefined) { moveTo(ids, b.dataset.move || null); return; }
    ({ abrir: () => openProfile(p), cerrar: () => closeChrome(p), editar: () => dlgProfile(p), duplicar: () => duplicate(p),
       carpeta: () => toast(`Se abre la carpeta de ${p.name} en ${fileMgr()}`), eliminar: () => dlgDelete(p) })[b.dataset.m]?.();
  });
  batch.addEventListener("click", (e) => {
    const b = e.target.closest("[data-b]"); if (!b || b.disabled) return;
    const ids = [...S.multi];
    if (b.dataset.b === "clear") { S.multi.clear(); render(); }
    if (b.dataset.b === "abrir") {
      const closed = ids.map(byId).filter((p) => !p.open);
      closed.forEach((p, i) => setTimeout(() => openProfile(p, true), i * 250));
      toast(`Abriendo ${closed.length} perfiles`); S.multi.clear(); render();
    }
    if (b.dataset.b === "mover") {
      menu.innerHTML = `<p class="lbl">Mover ${ids.length} perfiles a</p>${moveItems(undefined)}`;
      menu.dataset.ids = ids.join(","); menu.hidden = false;
      const r = b.getBoundingClientRect(), wr = win.getBoundingClientRect();
      menu.style.left = Math.max(8, r.left - wr.left) + "px";
      menu.style.top = (r.top - wr.top - menu.offsetHeight - 8) + "px";
      menu.querySelector("button:not(:disabled)")?.focus();
    }
  });
  side.addEventListener("click", (e) => {
    const n = e.target.closest("[data-group]");
    if (n) { S.group = n.dataset.group || null; S.multi.clear(); render(); return; }
    const a = e.target.closest("[data-act]");
    if (a?.dataset.act === "ajustes") dlgSettings();
    if (a?.dataset.act === "addgroup") { S.addingGroup = true; render(); }
  });
  content.addEventListener("dragstart", (e) => {
    const it = e.target.closest("[data-id]"); if (!it) return;
    e.dataTransfer.setData("text/plain", (S.multi.has(it.dataset.id) ? [...S.multi] : [it.dataset.id]).join(","));
  });
  side.addEventListener("dragover", (e) => { const n = e.target.closest('[data-group]:not([data-group=""])'); if (n) { e.preventDefault(); $$(".nav.drop", side).forEach((x) => x.classList.remove("drop")); n.classList.add("drop"); } });
  side.addEventListener("dragleave", (e) => e.target.closest?.(".nav")?.classList.remove("drop"));
  side.addEventListener("drop", (e) => {
    const n = e.target.closest('[data-group]:not([data-group=""])'); if (!n) return;
    e.preventDefault(); moveTo(e.dataTransfer.getData("text/plain").split(",").filter(Boolean), n.dataset.group);
  });
  new MutationObserver(() => $$("[data-id]", content).forEach((el) => (el.draggable = true))).observe(content, { childList: true });
  $(".top").addEventListener("click", (e) => { if (e.target.closest('[data-act="ajustes"]')) dlgSettings(); });
  $("#act-bar").addEventListener("click", () => { S.actOpen = !S.actOpen; renderActivity(); });
  layer.addEventListener("click", (e) => { if (e.target === layer || e.target.closest("[data-close]")) closeDialog(); });
  document.addEventListener("click", (e) => { if (!menu.hidden && !menu.contains(e.target) && !e.target.closest('[data-act="menu"], [data-b="mover"]')) closeMenu(); });

  $("#q").addEventListener("input", (e) => { S.q = e.target.value; render(); });
  $("#q").addEventListener("keydown", (e) => {
    if (e.key === "Escape") { S.q = ""; e.target.value = ""; render(); e.target.blur(); }
    if (e.key === "ArrowDown") { e.preventDefault(); e.target.blur(); move(1); }
    if (e.key === "Enter") { const f = visible()[0]; if (f) { S.sel = f.id; render(); openProfile(f); } }
  });

  function cols() {
    if (S.view !== "grid") return 1;
    const g = $(".grid", content); if (!g) return 1;
    return getComputedStyle(g).gridTemplateColumns.split(" ").length;
  }
  function move(dir) {
    const list = visible(); if (!list.length) return;
    let i = list.findIndex((p) => p.id === S.sel);
    i = i < 0 ? 0 : Math.max(0, Math.min(list.length - 1, i + dir));
    S.sel = list[i].id; S.multi.clear(); render();
    content.querySelector(`[data-id="${S.sel}"]`)?.scrollIntoView({ block: "nearest" });
  }
  document.addEventListener("keydown", (e) => {
    if (!layer.hidden) { if (e.key === "Escape") { e.preventDefault(); closeDialog(); } return; }
    if (!menu.hidden) {
      if (e.key === "Escape") { closeMenu(); return; }
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        const it = $$("button:not(:disabled)", menu), i = it.indexOf(document.activeElement);
        it[(i + (e.key === "ArrowDown" ? 1 : -1) + it.length) % it.length]?.focus();
      }
      return;
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); if (S.profiles.length) $("#q").focus(); return; }
    if (e.target.closest("input, textarea, select")) return;
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "a" && S.profiles.length) { e.preventDefault(); S.multi = new Set(visible().map((p) => p.id)); render(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const p = byId(S.sel);
    switch (e.key) {
      case "Escape": if (S.multi.size) { S.multi.clear(); render(); } break;
      case "n": case "N": e.preventDefault(); dlgProfile(null); break;
      case "/": e.preventDefault(); if (S.profiles.length) $("#q").focus(); break;
      case "ArrowRight": e.preventDefault(); move(1); break;
      case "ArrowLeft": e.preventDefault(); move(-1); break;
      case "ArrowDown": e.preventDefault(); move(cols()); break;
      case "ArrowUp": e.preventDefault(); move(-cols()); break;
      case "Enter": if (p && !e.target.closest("button")) { e.preventDefault(); openProfile(p); } break;
      case "e": case "E": if (p) { e.preventDefault(); dlgProfile(p); } break;
      case "Backspace": case "Delete": if (p && !S.multi.size) { e.preventDefault(); dlgDelete(p); } break;
      case ",": e.preventDefault(); dlgSettings(); break;
    }
  });

  /* ---------- Controles del mockup ---------- */
  function setScenario(v) {
    S.scenario = v; S.q = ""; $("#q").value = ""; S.group = null; S.status = "all"; S.opening.clear(); S.custom = null; S.multi.clear(); S.addingGroup = false;
    closeMenu(); closeDialog();
    S.profiles = v === "vacio" ? [] : SEED.map((p) => ({ ...p }));
    S.groups = v === "vacio" ? [] : SEED_GROUPS.map((g) => ({ ...g }));
    S.log = v === "vacio" ? [] : SEED_LOG.map((e) => ({ ...e }));
    S.browser = v === "sinchrome" ? null : "chrome";
    S.sel = null; render();
  }
  const press = (k, v) => $$(`[data-demo="${k}"] button`).forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.v === v)));
  $$(".demo .seg").forEach((seg) => seg.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const k = seg.dataset.demo, v = b.dataset.v; press(k, v);
    if (k === "scenario") setScenario(v);
    if (k === "os") { S.os = v; render(); }
    if (k === "theme") document.documentElement.dataset.theme = v;
  }));
  $(".jump").addEventListener("click", (e) => {
    const b = e.target.closest("[data-jump]"); if (!b) return;
    e.stopPropagation();
    const j = b.dataset.jump;
    if (!S.profiles.length && !["crear", "ajustes"].includes(j)) { setScenario("lista"); press("scenario", "lista"); }
    closeDialog(); closeMenu();
    const target = byId("p2") || S.profiles.find((p) => !p.open) || S.profiles[0];
    if (j === "crear") dlgProfile(null);
    if (j === "editar") { S.sel = target.id; render(); dlgProfile(target); }
    if (j === "eliminar") { S.sel = target.id; render(); dlgDelete(target); }
    if (j === "ajustes") dlgSettings();
    if (j === "menu") { S.group = null; S.status = "all"; render(); openMenu(S.profiles.find((x) => x.open) || S.profiles[0], 0, 0, true); }
    if (j === "multi") { S.group = "g1"; S.status = "all"; S.sel = null; S.multi = new Set(S.profiles.filter((p) => p.group === "g1").map((p) => p.id)); render(); }
    if (j === "actividad") { S.actOpen = true; renderActivity(); }
  });

  setScenario("lista");
})();
</script>
</body>
</html>
